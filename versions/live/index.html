<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>Rendering · Angel Lakra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <!-- SPIKE: an unwritten card, rendered live by api/render.js. The model's
         page goes into a frame with scripts and network access switched off. -->
    <style>
      :root {
        --bg: #0a0a0b;
        --card: #141416;
        --ink: #f3f2ee;
        --muted: #86858a;
        --line: #232326;
        --hot: #d7ff3a;
        --font: "Geist", system-ui, -apple-system, sans-serif;
        --mono: "Geist Mono", ui-monospace, Menlo, monospace;
        --serif: "Instrument Serif", Georgia, serif;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.4 var(--font);
        padding-top: env(safe-area-inset-top, 0px);
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--hot);
        outline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px 16px;
        flex-wrap: wrap;
        padding: 10px clamp(12px, 2.6vw, 24px);
        border-bottom: 1px solid var(--line);
      }
      .bar .back {
        text-decoration: none;
        color: var(--muted);
      }
      .bar .back:hover {
        color: var(--ink);
      }
      .bar h1 {
        margin: 0;
        font: 400 italic 20px/1.1 var(--serif);
      }
      .status {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        font: 500 11px var(--mono);
        letter-spacing: 0.04em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .status i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
      }
      .busy .status {
        color: var(--hot);
      }
      .busy .status i {
        background: var(--hot);
        animation: pulse 1s ease-in-out infinite;
      }
      .bar button {
        font: 500 11px var(--mono);
        letter-spacing: 0.04em;
        color: var(--bg);
        background: var(--hot);
        border: 0;
        border-radius: 999px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .bar button:active {
        transform: scale(0.97);
      }
      .note {
        flex-basis: 100%;
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }
      .stage {
        position: relative;
        min-height: 0;
        background: #fff;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      /* shown until the page has something to paint, and for errors */
      .wait {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        place-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        background:
          repeating-linear-gradient(
            0deg,
            transparent 0 11px,
            rgba(255, 255, 255, 0.025) 11px 12px
          ),
          var(--card);
        transition: opacity 0.4s ease;
      }
      .wait.gone {
        opacity: 0;
        pointer-events: none;
      }
      .wait b {
        font: 500 10px var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--hot);
      }
      .wait p {
        margin: 0;
        max-width: 22ch;
        font: 400 italic clamp(28px, 5vw, 44px)/1.05 var(--serif);
        text-wrap: balance;
      }
      .wait small {
        font: 400 11px var(--mono);
        color: var(--muted);
        max-width: 60ch;
        height: 3em;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .busy .wait b::after {
        content: "";
        animation: dots 1.2s steps(4) infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      @keyframes dots {
        25% {
          content: ".";
        }
        50% {
          content: "..";
        }
        75% {
          content: "...";
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .busy .status i,
        .busy .wait b::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="busy">
    <header class="bar">
      <a class="back" href="/#wall">← Library</a>
      <h1 id="title"></h1>
      <span class="status" role="status"><i></i><span id="status"></span></span>
      <button id="again" type="button" hidden>Render again</button>
      <p class="note">
        Written just now by an AI model from Angel's facts. Nobody has checked
        this page, so it can get things wrong. The
        <a href="/#wall">written versions</a> are the ones to trust.
      </p>
    </header>
    <main class="stage">
      <iframe
        id="frame"
        title="The rendered page"
        sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"
      ></iframe>
      <div class="wait" id="wait">
        <b id="wait-label">Rendering</b>
        <p id="wait-title"></p>
        <small id="wait-code" aria-hidden="true"></small>
      </div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const c = new URLSearchParams(location.search).get("c") || "";
      const title = c.charAt(0).toUpperCase() + c.slice(1);
      document.title = `${title || "Unwritten"} · rendered live`;
      $("title").textContent = $("wait-title").textContent = title;

      // The frame has no allow-scripts, so nothing the model writes can run,
      // and this policy stops its page loading anything from the network.
      const CSP = `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:">`;
      const secs = (t0) => ((performance.now() - t0) / 1000).toFixed(1) + "s";
      const stop = (label, msg) => {
        document.body.classList.remove("busy");
        $("wait").classList.remove("gone");
        $("wait-label").textContent = label;
        $("wait-code").textContent = "";
        $("status").textContent = msg;
        $("again").hidden = false;
      };

      async function render() {
        document.body.classList.add("busy");
        $("again").hidden = true;
        $("wait").classList.remove("gone");
        $("wait-label").textContent = "Rendering";
        $("status").textContent = "Rendering…";
        const t0 = performance.now();
        const tick = setInterval(
          () => ($("status").textContent = `Rendering… ${secs(t0)}`),
          100,
        );
        try {
          const r = await fetch("/api/render", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ c }),
          });
          if (!r.ok) {
            const why = {
              400: "This one can't be rendered. Pick an unwritten card from the wall.",
              429: "Too many renders in a minute. Give it a moment.",
              503: "The renderer isn't switched on here.",
            };
            return stop(
              "Not rendered",
              why[r.status] || "The renderer is unavailable.",
            );
          }
          const model = r.headers.get("X-Model") || "the model";
          // write the page into the frame as it arrives, so it paints top down
          const doc = $("frame").contentDocument;
          doc.open();
          doc.write(CSP);
          let n = 0,
            html = "",
            shown = false;
          const reader = r.body
            .pipeThrough(new TextDecoderStream())
            .getReader();
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            doc.write(value);
            html += value;
            n += value.length;
            $("wait-code").textContent = html.slice(-180);
            // keep the cover up through the <style> block, until there is a body
            if (!shown && /<body[\s>]/i.test(html)) {
              shown = true;
              $("wait").classList.add("gone");
            }
          }
          doc.close();
          if (!shown)
            return stop("Not rendered", `${model} sent back nothing usable.`);
          document.body.classList.remove("busy");
          $("status").textContent =
            `Rendered by ${model} in ${secs(t0)} · ${(n / 1024).toFixed(1)} kB`;
          $("again").hidden = false;
        } catch {
          stop("Not rendered", "The connection dropped mid-render.");
        } finally {
          clearInterval(tick);
        }
      }
      $("again").addEventListener("click", render);
      render();
    </script>
  </body>
</html>
