<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>Render a version · Angel Lakra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <!-- SPIKE: an unwritten card, rendered live by api/render.js. The model's
         page goes into a frame with scripts and network access switched off. -->
    <style>
      :root {
        --bg: #0a0a0b;
        --card: #141416;
        --ink: #f3f2ee;
        --muted: #86858a;
        --line: #232326;
        --hot: #d7ff3a;
        --font: "Geist", system-ui, -apple-system, sans-serif;
        --mono: "Geist Mono", ui-monospace, Menlo, monospace;
        --serif: "Instrument Serif", Georgia, serif;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.4 var(--font);
        padding-top: env(safe-area-inset-top, 0px);
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--hot);
        outline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px 16px;
        flex-wrap: wrap;
        padding: 10px clamp(12px, 2.6vw, 24px);
        border-bottom: 1px solid var(--line);
      }
      .bar .back {
        text-decoration: none;
        color: var(--muted);
      }
      .bar .back:hover {
        color: var(--ink);
      }
      .ask {
        flex: 1 1 320px;
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }
      .ask label {
        flex: 1;
        display: grid;
        gap: 4px;
        font: 500 10px var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .ask textarea {
        width: 100%;
        min-height: 38px;
        max-height: 30vh;
        field-sizing: content;
        resize: none;
        padding: 8px 10px;
        font: 400 italic 18px/1.2 var(--serif);
        letter-spacing: 0;
        text-transform: none;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .ask textarea:focus-visible {
        outline: 0;
        border-color: var(--hot);
      }
      .ask textarea::placeholder {
        color: var(--muted);
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font: 500 11px var(--mono);
        letter-spacing: 0.04em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .status i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
      }
      .busy .status {
        color: var(--hot);
      }
      .busy .status i {
        background: var(--hot);
        animation: pulse 1s ease-in-out infinite;
      }
      .ask button {
        flex: none;
        height: 38px;
        min-width: 84px;
        font: 500 11px var(--mono);
        letter-spacing: 0.04em;
        color: var(--bg);
        background: var(--hot);
        border: 0;
        border-radius: 8px;
        padding: 0 14px;
        cursor: pointer;
        transition: transform 0.16s ease-out;
      }
      .ask button:active {
        transform: scale(0.97);
      }
      .busy .ask button {
        color: var(--ink);
        background: none;
        box-shadow: inset 0 0 0 1px var(--line);
      }
      /* start the rendered page over, without asking the model again */
      .reload {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        padding: 0;
        color: var(--muted);
        background: none;
        border: 1px solid var(--line);
        border-radius: 50%;
        cursor: pointer;
        transition:
          color 0.2s ease,
          transform 0.16s ease-out;
      }
      .reload:hover {
        color: var(--ink);
      }
      .reload:active {
        transform: scale(0.94);
      }
      .note {
        flex-basis: 100%;
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }
      /* send it in, or vote: only there once a page is on screen */
      .act {
        flex-basis: 100%;
        display: flex;
        align-items: center;
        gap: 8px 12px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
      }
      .act button {
        font: 500 11px var(--mono);
        letter-spacing: 0.04em;
        color: var(--hot);
        background: none;
        border: 1px solid currentColor;
        border-radius: 999px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .act button[aria-pressed="true"] {
        color: var(--bg);
        background: var(--hot);
        border-color: var(--hot);
      }
      .act button.link {
        padding: 0;
        border: 0;
        color: inherit;
        font: inherit;
        letter-spacing: 0;
        text-decoration: underline;
      }
      .act #gbtn {
        color-scheme: light; /* Google's button draws its own background */
      }
      .stage {
        position: relative;
        min-height: 0;
        background: #fff;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      /* shown until the page has something to paint, and for errors */
      .wait {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        place-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        background:
          repeating-linear-gradient(
            0deg,
            transparent 0 11px,
            rgba(255, 255, 255, 0.025) 11px 12px
          ),
          var(--card);
        transition: opacity 0.4s ease;
      }
      .wait.gone {
        opacity: 0;
        pointer-events: none;
      }
      .wait b {
        font: 500 10px var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--hot);
      }
      .wait p {
        margin: 0;
        max-width: 22ch;
        font: 400 italic clamp(28px, 5vw, 44px)/1.05 var(--serif);
        text-wrap: balance;
      }
      .wait small {
        font: 400 11px var(--mono);
        color: var(--muted);
        max-width: 60ch;
        max-height: 3em;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .busy .wait b::after {
        content: "";
        animation: dots 1.2s steps(4) infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
      @keyframes dots {
        25% {
          content: ".";
        }
        50% {
          content: "..";
        }
        75% {
          content: "...";
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .busy .status i,
        .busy .wait b::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <a class="back" href="/#wall">← Library</a>
      <form class="ask" id="ask">
        <label
          >Prompt
          <textarea
            id="prompt"
            rows="1"
            maxlength="300"
            required
            placeholder="Angel as a boarding pass"
            enterkeyhint="go"
          ></textarea>
        </label>
        <button id="go">Render</button>
      </form>
      <span class="status" role="status"><i></i><span id="status"></span></span>
      <button
        class="reload"
        id="reload"
        type="button"
        title="Reload this page"
        aria-label="Reload the rendered page"
        hidden
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20 11a8 8 0 1 0-2.3 6.3" />
          <path d="M20 4v7h-7" />
        </svg>
      </button>
      <div class="act" id="act" hidden></div>
      <p class="note">
        Pages here are written on the spot by an AI model from Angel's facts.
        Nobody has checked them, so they can get things wrong. The
        <a href="/#wall">written versions</a> are the ones to trust.
      </p>
    </header>
    <main class="stage">
      <iframe
        id="frame"
        title="The rendered page"
        sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"
      ></iframe>
      <div class="wait" id="wait">
        <b id="wait-label"></b>
        <p id="wait-title"></p>
        <small id="wait-code"></small>
      </div>
    </main>
    <script src="/auth.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const prompt = $("prompt");
      const params = new URLSearchParams(location.search);
      prompt.value = params.get("c") || "";
      const HINT =
        "Change the prompt if you like: a different object, a style, a mood. Then press Render.";

      // The model's page runs its own scripts, so it must never run as this
      // site. The frame is sandboxed WITHOUT allow-same-origin: its scripts get
      // an origin of their own and cannot reach this page, the sign-in kept in
      // localStorage, or the API as the visitor. Never add allow-same-origin
      // next to allow-scripts. This policy then takes away the network.
      const CSP = `<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:">`;
      // We can't write into a frame from another origin, so the frame starts
      // with this small page, which writes whatever we post to it into itself.
      // document.open() wipes its listeners, hence listening a second time.
      const BOOT = `<script>
        addEventListener("message", function first(e) {
          if (e.source !== parent) return;
          removeEventListener("message", first);
          document.open();
          const write = (e) => {
            if (e.source !== parent) return;
            e.data === null ? document.close() : document.write(e.data);
          };
          addEventListener("message", write);
          write(e);
        });
      <\/script>`;
      // start a clean frame; returns write(html), and write(null) to finish
      async function fresh() {
        const f = $("frame");
        const loaded = new Promise((done) =>
          f.addEventListener("load", done, { once: true }),
        );
        f.srcdoc = BOOT;
        await loaded;
        const write = (html) => f.contentWindow.postMessage(html, "*");
        write(CSP);
        return write;
      }
      const secs = (t0) => ((performance.now() - t0) / 1000).toFixed(1) + "s";
      // the cover over the frame: before a render, while one starts, on errors
      const cover = (label, small = "") => {
        $("wait").classList.remove("gone");
        $("wait-label").textContent = label;
        $("wait-title").textContent = prompt.value.trim() || prompt.placeholder;
        $("wait-code").textContent = small;
      };
      let stop = null; // aborts the render in flight
      let page = ""; // the HTML in the frame, kept so it can be reloaded
      const idle = (msg, again = true) => {
        stop = null;
        document.body.classList.remove("busy");
        $("status").textContent = msg;
        $("go").textContent = again ? "Render again" : "Render";
        $("reload").hidden = !page;
      };

      async function render() {
        const c = prompt.value.trim();
        if (c.length < 3) return prompt.focus();
        history.replaceState(null, "", "?c=" + encodeURIComponent(c));
        document.title = `${c} · rendered live`;
        const ctl = new AbortController();
        stop = () => ctl.abort();
        page = "";
        $("reload").hidden = true;
        rid = idea = null;
        sent = false;
        paint();
        document.body.classList.add("busy");
        $("go").textContent = "Stop";
        cover("Rendering");
        const t0 = performance.now();
        const tick = setInterval(
          () => ($("status").textContent = `${phase}… ${secs(t0)}`),
          100,
        );
        let phase = "Thinking",
          shown = false,
          write = () => {};
        try {
          const r = await fetch("/api/render", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ c }),
            signal: ctl.signal,
          });
          if (!r.ok) {
            const why = {
              400: "That prompt is too short to render.",
              429: "Too many renders in a minute. Give it a moment.",
              503: "The renderer isn't switched on here.",
            };
            cover("Not rendered");
            return idle(why[r.status] || "The renderer is unavailable.");
          }
          const model = r.headers.get("X-Model") || "the model";
          // write the page into the frame as it arrives, so it paints top down
          write = await fresh();
          let html = "";
          const reader = r.body
            .pipeThrough(new TextDecoderStream())
            .getReader();
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            write(value);
            page = html += value;
            phase = "Writing";
            $("wait-code").textContent = html.slice(-180);
            // keep the cover up through the <style> block, until there is a body
            if (!shown && /<body[\s>]/i.test(html)) {
              shown = true;
              $("wait").classList.add("gone");
            }
          }
          write(null);
          if (!shown) {
            cover("Not rendered");
            return idle(`${model} sent back nothing usable. Try again.`);
          }
          // a whole page can be sent in as an idea
          if (!html.endsWith("<!--cut-->")) rid = r.headers.get("X-Render-Id");
          paint();
          idle(
            html.endsWith("<!--cut-->")
              ? `Cut off: ${model} hit the length limit after ${secs(t0)}`
              : `Rendered by ${model} in ${secs(t0)} · ${(html.length / 1024).toFixed(1)} kB`,
          );
        } catch {
          // Stop keeps whatever has been painted so far
          write(null);
          if (!shown)
            cover(ctl.signal.aborted ? "Stopped" : "Not rendered", HINT);
          idle(
            ctl.signal.aborted
              ? `Stopped after ${secs(t0)}`
              : "The connection dropped mid-render.",
          );
        } finally {
          clearInterval(tick);
        }
      }
      // Ideas (api/ideas.js): a signed-in visitor can send the page they just
      // rendered to Angel, and vote on the ones he has put on the wall.
      const esc = (t) =>
        String(t).replace(/[&<>"]/g, (ch) => `&#${ch.charCodeAt(0)};`);
      const act = $("act");
      let on = false, // the site has a database and a Google client id
        rid = null, // the render on screen, if it can be sent in
        idea = null, // the idea on screen, when the page was opened with ?id=
        sent = false;
      function paint() {
        act.hidden = !on || !(rid || idea);
        if (act.hidden) return;
        const me = AUTH.user;
        const about = idea ? `<span>Proposed by ${esc(idea.name)}.</span>` : "";
        if (!me) {
          act.innerHTML = `<span id="gbtn"></span><span>${idea ? "to vote for this one." : "to send this one to Angel."}</span>${about}`;
          return AUTH.button($("gbtn"));
        }
        const main = idea
          ? idea.status === "approved"
            ? `<button data-do="vote" aria-pressed="${idea.voted}">▲ ${idea.voted ? "Voted" : "Vote"} · ${idea.votes}</button>`
            : `<span>Waiting for Angel to look at it.</span>`
          : sent
            ? `<span>Sent. Angel looks at every one before it goes on the wall.</span>`
            : `<button data-do="send">Send this one to Angel</button><span>If it goes on the wall, your first name goes with it.</span>`;
        act.innerHTML = `${main}${about}<span>Signed in as ${esc(me.name)} · <button class="link" data-do="out">Sign out</button></span>`;
      }
      act.addEventListener("click", async (e) => {
        const what = e.target.dataset.do;
        if (what === "out") return AUTH.out();
        if (what !== "send" && what !== "vote") return;
        e.target.disabled = true;
        const r = await AUTH.api("/api/ideas", {
          do: what === "send" ? "submit" : "vote",
          id: rid || idea.id,
        });
        if (r.ok && what === "send") sent = true;
        if (r.ok && what === "vote") Object.assign(idea, r);
        paint(); // a 401 has already signed them out, so this asks again
        if (!r.ok && r.code !== 401)
          act.insertAdjacentHTML(
            "beforeend",
            `<span role="alert">${esc(r.code === 429 ? "That's the limit for today." : "That didn't go through. Try again.")}</span>`,
          );
      });
      async function openIdea(id) {
        const r = await AUTH.api("/api/ideas?id=" + encodeURIComponent(id));
        if (!r.ok) {
          cover("Not found", "That idea isn't on the wall.");
          // not the placeholder prompt, which would look like the wrong idea
          return ($("wait-title").textContent = "No such idea");
        }
        idea = r;
        prompt.value = r.prompt;
        document.title = `${r.prompt} · proposed`;
        const write = await fresh();
        write((page = r.html));
        write(null);
        $("wait").classList.add("gone");
        idle("A visitor's render, kept as it was");
        paint();
      }
      fetch("/api/ideas")
        .then((r) => r.json())
        .then((cfg) => {
          if (!(on = !!cfg.on)) return;
          AUTH.start(cfg.clientId, paint);
          if (params.get("id")) openIdea(params.get("id"));
        })
        .catch(() => {});

      $("reload").addEventListener("click", async () => {
        const write = await fresh();
        write(page);
        write(null);
      });
      $("ask").addEventListener("submit", (e) => {
        e.preventDefault();
        stop ? stop() : render();
      });
      // Enter renders, Shift+Enter is a new line
      prompt.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          $("ask").requestSubmit();
        }
      });
      prompt.addEventListener("input", () => {
        if (!stop)
          $("wait-title").textContent =
            prompt.value.trim() || prompt.placeholder;
      });
      cover("Not rendered yet", HINT);
      idle("Ready", false);
    </script>
  </body>
</html>
